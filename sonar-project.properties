# Excluir arquivo que usa Tailwind CSS das análises do SonarQube
sonar.exclusions=src/styles/globals.css

# Arquivos de configuração na raiz do projeto (fora de src/): o próprio
# vitest.config.ts já não coleta cobertura deles (coverage.include só
# cobre src/**), então nunca há dado de cobertura real para reportar.
sonar.coverage.exclusions=tailwind.config.js,lint-staged.config.mjs

# Configurações adicionais para ignorar regras CSS específicas
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4084
sonar.issue.ignore.multicriteria.e1.resourceKey=src/styles/globals.css
sonar.issue.ignore.multicriteria.e2.ruleKey=css:unknown-at-rule
sonar.issue.ignore.multicriteria.e2.resourceKey=src/styles/globals.css
